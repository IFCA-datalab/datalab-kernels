# Build and publish the kernel images used by the kernelspecs of this repo.
# The tags are fixed versions: the kernelspecs reference them, never :latest.
name: Kernel and gateway images

on:
  push:
    branches: [main]
    paths: ["docker-images/**", ".github/workflows/kernel-images.yml"]
  pull_request:
    paths: ["docker-images/**", ".github/workflows/kernel-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kernel-py-climate
            tag: eg3.3.0-base2026-10-05
          - image: kernel-pyspark-delta
            tag: spark4.2.0-delta4.4.1-base2026-10-05
          - image: enterprise-gateway
            tag: 3.3.0-spark4.2.0-base2026-10-05
    steps:
      - uses: actions/checkout@v4
      # The images are large: make room on the runner.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker-images/${{ matrix.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/ifca-datalab/${{ matrix.image }}:${{ matrix.tag }}
            ghcr.io/ifca-datalab/${{ matrix.image }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
